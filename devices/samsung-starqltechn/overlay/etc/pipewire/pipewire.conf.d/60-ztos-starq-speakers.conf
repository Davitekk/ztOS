# ztOS on the Galaxy S9 (Snapdragon): media on the speakers as loud as the
# phone allows, the way Samsung's DSP does it, which ztOS does not have.
#
# The MAX98512 pair is at its most (analog 18 dB, HiFi.conf; boost 10 V):
# stock is louder through Samsung's speaker management (Maxim DSM) on the
# DSP, and media from the web is loudness-normalized well below full scale,
# so the speakers stayed quiet while calls were loud. Here, before the
# speakers only (a WirePlumber smart filter: headphones and Bluetooth are
# left alone): a high-pass at 300 Hz, what the small speakers cannot play and
# only costs them headroom and excursion; a compressor (3:1 above -24 dB,
# +8 dB makeup), then +12 dB into a look-ahead limiter at -1 dBFS
# (swh-plugins). Quiet and middle passages come up to 20 dB louder, the peaks
# stay at full scale: the amp's most, as without the filter.
context.modules = [
	{ name = libpipewire-module-filter-chain
		args = {
			node.description = "Speakers"
			media.name = "Speakers"
			filter.graph = {
				nodes = [
					{ type = builtin name = hpl label = bq_highpass control = { "Freq" = 300.0 "Q" = 0.707 } }
					{ type = builtin name = hpr label = bq_highpass control = { "Freq" = 300.0 "Q" = 0.707 } }
					{
						type = ladspa name = compressor
						plugin = sc4_1882 label = sc4
						control = {
							"RMS/peak" = 0.5 "Attack time (ms)" = 10.0 "Release time (ms)" = 150.0
							"Threshold level (dB)" = -24.0 "Ratio (1:n)" = 3.0 "Knee radius (dB)" = 6.0
							"Makeup gain (dB)" = 8.0
						}
					}
					{
						type = ladspa name = limiter
						plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter
						control = { "Input gain (dB)" = 12.0 "Limit (dB)" = -1.0 "Release time (s)" = 0.1 }
					}
				]
				links = [
					{ output = "hpl:Out" input = "compressor:Left input" }
					{ output = "hpr:Out" input = "compressor:Right input" }
					{ output = "compressor:Left output" input = "limiter:Input 1" }
					{ output = "compressor:Right output" input = "limiter:Input 2" }
				]
				inputs = [ "hpl:In" "hpr:In" ]
				outputs = [ "limiter:Output 1" "limiter:Output 2" ]
			}
			capture.props = {
				node.name = "ztos-starq-speakers"
				media.class = Audio/Sink
				audio.position = [ FL FR ]
				filter.smart = true
				filter.smart.name = "ztos-starq-speakers"
				filter.smart.target = { node.name = "alsa_output.platform-sound.HiFi__Speakers__sink" }
			}
			playback.props = {
				node.name = "ztos-starq-speakers.output"
				node.passive = true
				audio.position = [ FL FR ]
			}
		}
	}
]
